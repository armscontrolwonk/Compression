[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fissionyield"
version = "0.1.0"
description = "Cochran one-group fast-fission yield model: solve and plot yield, mass, or compression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "armscontrolwonk" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "matplotlib>=3.5",
]

[project.scripts]
fissionyield = "fissionyield.cli:main"
fissionyield-gui = "fissionyield.gui:main"
fissionyield-gui-composite = "fissionyield.gui_composite:main"

[project.optional-dependencies]
test = ["pytest>=7"]
gui = ["PySide6>=6.5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
